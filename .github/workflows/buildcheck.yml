name: Standard Build Check

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  buildtest:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'npins/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Build and test
        run: |
          nix-shell --run '
            bash ./scripts/install_vss_tools.sh
            just

            # Install csvlint to check compliance with RFC 4180.
            go install github.com/Clever/csvlint/cmd/csvlint@latest
            export PATH="$(go env GOPATH)/bin:$PATH"
            csvlint vss*.csv
          '

      - name: Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vss-artifacts
          # Listing all artifacts that shall be managed as release artifacts
          path: |
            vss.csv
            vss.idl
            vss.json
            vss.jsonschema
            vss.yaml
            vss_noexpand.json
            vss_compose.tar.gz
            vss_samm.tar.gz
            vss_apigear.tar.gz
            vss_graphql.tar.gz
          if-no-files-found: error
